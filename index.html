<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉他轉調與順階和弦查詢器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎸 吉他轉調與順階和弦查詢</h1>
    
    <!-- 選擇主音 -->
    <div class="section">
      <h3>1. 選擇目標音高 (Key)</h3>
      <div class="btn-group" id="root-buttons">
        <button class="btn root-btn active" data-root="C">C</button>
        <button class="btn root-btn" data-root="C#">C#</button>
        <button class="btn root-btn" data-root="D">D</button>
        <button class="btn root-btn" data-root="D#">D#</button>
        <button class="btn root-btn" data-root="E">E</button>
        <button class="btn root-btn" data-root="F">F</button>
        <button class="btn root-btn" data-root="F#">F#</button>
        <button class="btn root-btn" data-root="G">G</button>
        <button class="btn root-btn" data-root="G#">G#</button>
        <button class="btn root-btn" data-root="A">A</button>
        <button class="btn root-btn" data-root="A#">A#</button>
        <button class="btn root-btn" data-root="B">B</button>
      </div>
    </div>

    <!-- 選擇大小調 -->
    <div class="section">
      <h3>2. 選擇調性 (Mode)</h3>
      <div class="btn-group" id="mode-buttons">
        <button class="btn mode-btn active" data-mode="major">大調 (Major)</button>
        <button class="btn mode-btn" data-mode="minor">小調 (Minor)</button>
      </div>
    </div>

    <!-- 選擇移調夾 -->
    <div class="section">
      <h3>3. 選擇移調夾 (Capo)</h3>
      <div class="btn-group" id="capo-buttons">
        <button class="btn capo-btn active" data-capo="0">Capo 0</button>
        <button class="btn capo-btn" data-capo="1">Capo 1</button>
        <button class="btn capo-btn" data-capo="2">Capo 2</button>
        <button class="btn capo-btn" data-capo="3">Capo 3</button>
        <button class="btn capo-btn" data-capo="4">Capo 4</button>
        <button class="btn capo-btn" data-capo="5">Capo 5</button>
      </div>
    </div>

    <!-- 顯示結果 -->
    <div class="result-section">
      <h2 id="current-key-title" style="color: #409eff; font-size: 1.2rem; line-height: 1.5;"></h2>
      <div class="chords-grid" id="chords-display">
        <!-- 由 JavaScript 動態繪製 -->
      </div>
    </div>
  </div>

  <!-- ======= 底部固定贊助與建議區塊 ======= -->
  <div class="bottom-action-container" id="action-container">
    <button class="close-action-btn" onclick="document.getElementById('action-container').style.display='none'">關閉 ✕</button>
    
<div class="action-content">
      <span class="action-text">喜歡這個轉調器嗎？</span>
      
      <!-- 建議按鈕 (白底) -->
      <a href="https://forms.gle/vydv2G1ThjxATYvL7" target="_blank" class="action-btn feedback-btn">📝 建議/點歌</a>
      
      <!-- 音樂按鈕 (深藍底) -->
      <a href="https://streetvoice.com/hjj1203/songs/" target="_blank" class="action-btn streetvoice-btn">🎸 我寫的歌</a>
      
      <!-- IG按鈕 (漸層底) -->
      <a href="https://www.instagram.com/imweizhe1203/" target="_blank" class="action-btn ig-btn"> 我的 IG</a>
    </div>

  <script src="script.js"></script>
</body>
</html>
